name: Deploy server
on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/u-camp-2025/ucamp_project_server:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build (Gradle bootJar)
        run: ./gradlew clean bootJar -x test

      - name: Prepare JAR for Docker
        run: |
          JAR_PATH=$(ls build/libs/*-SNAPSHOT.jar | head -n1)
          cp "$JAR_PATH" app.jar

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & Push Docker image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Prepare SSH key
        run: |
          umask 077
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -lf ~/.ssh/ec2_key || true

      - name: Deploy to EC2
        run: |
          ssh -vvv -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
              echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u 'gh-read' --password-stdin && \
              cd /opt/ucamp/app && \
              docker compose pull app && \
              docker compose up -d app && \
              docker image prune -f
            "
