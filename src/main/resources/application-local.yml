spring:
  config:
    activate:
      on-profile: local

  datasource:
#    url: jdbc:h2:mem:ucamp;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    url: jdbc:oracle:thin:@localhost:1521:XE
    driver-class-name: oracle.jdbc.OracleDriver
    username: SCOTT
    password: TIGER

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
#    database-platform: org.hibernate.dialect.H2Dialect
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true

server:
  port: 8080


# Kakao OAuth settings (must exactly match Kakao Dev Console)
kakao:
  client-id: "${KAKAO_CLIENT_ID}"
  client-secret: "${KAKAO_CLIENT_SECRET}"
  redirect-uri: "http://localhost:8080/api/auth/kakao/callback"

jwt:
  secret: "${JWT_SECRET}"           # >= 32 chars
  access-expiration: 3600000         # 1 hour (ms)
  refresh-expiration: 1209600000     # 14 days (ms)

client:
  origin: "${CLIENT_ORIGIN:http://localhost:3000}"