spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:ucamp;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

server:
  port: 8080

# Kakao OAuth settings (must exactly match Kakao Dev Console)
kakao:
  client-id: "${KAKAO_CLIENT_ID}"
  client-secret: "${KAKAO_CLIENT_SECRET}"
  redirect-uri: "http://localhost:8080/api/auth/kakao/callback"

jwt:
  secret: "${JWT_SECRET}"           # >= 32 chars
  access-expiration: 3600000         # 1 hour (ms)
  refresh-expiration: 1209600000     # 14 days (ms)akao/callback"